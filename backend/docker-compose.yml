services:
  postgres:
    image: postgres:17-alpine
    container_name: infyexchange-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infyexchange
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infyexchange"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data: