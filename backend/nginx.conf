# InfyExchange API gateway — nginx as a pure reverse proxy.
# The SPA is deployed separately (Vercel / Cloudflare Pages); this host serves only
# the backend API. This file is included inside the nginx http{} context by the
# nginx:alpine image (mounted at /etc/nginx/conf.d/default.conf).
#
# Because the frontend is now cross-origin, HTML-facing controls (CSP, etc.) must
# also be set on the static host (e.g. a `_headers` file on Cloudflare Pages or a
# `headers` block in vercel.json). This proxy can only protect the API origin.

# Rate-limit zones must live in the http context (this file is included inside http{})
# Modest edge limits: they complement the application-level limiters in the backend
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    server_name _;

    # Never advertise the nginx version
    server_tokens off;

    # Client upload limit matching backend max payload (5 images * 5MB + multipart overhead)
    client_max_body_size 30m;

    # Bound slow-loris style resource occupation (TH-18)
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Gzip compression for API responses (JSON)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers on API responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP for the API origin, kept in report-only mode. Do NOT add the frontend
    # origin to connect-src here: cross-origin API calls from the hosted SPA are
    # authorized by the backend CORS_ORIGINS setting, not by this CSP.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # HSTS: uncomment ONLY after HTTPS is confirmed for this API host (Cloudflare
    # proxy mode + working certificate) and no HTTP-only subdomain must be reached:
    # add_header Strict-Transport-Security "max-age=300" always;
    # Ramp: 300 -> 86400 (1 day) -> 604800 (1 week) -> 15552000 (180 days).

    # Deny access to hidden files (.git, .env, dotfiles)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check passthrough (used by deploy/monitoring probes)
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propagate the edge request ID so backend logs correlate with nginx logs
        proxy_set_header X-Request-ID $request_id;
    }

    # Reverse proxy API requests to FastAPI
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propagate the edge request ID so backend logs correlate with nginx logs
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # API-only host: no SPA to serve. Anything else is not found.
    location / {
        return 404;
    }
}
