# InfyExchange API gateway — nginx as a pure reverse proxy.
# The SPA is deployed separately (Vercel / Cloudflare Pages); this host serves only
# the backend API. This file is included inside the nginx http{} context by the
# nginx:alpine image (mounted at /etc/nginx/conf.d/default.conf).
#
# Caddy terminates public TLS and forwards requests over the private Docker network.
server {
    listen 80;
    server_name _;

    server_tokens off;

    # Upload limit: 5 images × 5 MB + multipart overhead
    client_max_body_size 30m;

    # Slow-loris mitigation
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Gzip for API JSON responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP (report-only until validated in production)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # HSTS — ramp the max-age gradually after TLS is confirmed stable
    # Start: add_header Strict-Transport-Security "max-age=300" always;
    # Final: add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    # add_header Strict-Transport-Security "max-age=300" always;

    # Deny hidden files (.git, .env, dotfiles)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check passthrough (deploy/monitoring probes)
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Reverse proxy all API traffic to FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # API-only host: no SPA to serve. Per-client throttling is enforced by FastAPI;
    # Nginx sees Caddy as its peer and must not apply a shared per-IP limit here.
    location / {
        return 404;
    }
}
