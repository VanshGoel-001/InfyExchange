# InfyExchange API gateway — nginx as a pure reverse proxy.
# The SPA is deployed separately (Vercel / Cloudflare Pages); this host serves only
# the backend API. This file is included inside the nginx http{} context by the
# nginx:alpine image (mounted at /etc/nginx/conf.d/default.conf).
#
# ---- Enabling TLS (one-time setup) ----
# 1. DNS: <API_DOMAIN> -> <ORIGIN_IP> as a Cloudflare-proxied A record.
# 2. Origin cert: Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create Certificate.
#    Save as backend/certs/<API_DOMAIN>.pem and .key; chmod 600 the key; add certs/ to .gitignore.
# 3. docker-compose.yml `web`: publish port 443 and mount ./certs read-only at /etc/nginx/certs.
# 4. Set server_name in both server blocks below to <API_DOMAIN>.
# 5. Confirm TLS handshake before anything else:
#        curl -v --resolve <API_DOMAIN>:443:<ORIGIN_IP> https://<API_DOMAIN>/health
# 6. Switch Cloudflare SSL mode to Full (strict) only after step 5 passes.
# 7. Restrict 80/443 ingress to Cloudflare IP ranges (SECURITY_RUNBOOK §3) —
#    while world-open, callers can bypass this proxy and its rate limits.
# 8. Repoint VITE_API_BASE_URL and CORS_ORIGINS to the https origin; redeploy both sides.
# 9. Ramp HSTS max-age: 300 -> 86400 -> 604800 -> 15552000.
#    Never lengthen before the previous age has expired; a cached bad max-age cannot be recalled.

# Rate-limit zones (must live in http context)
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# ---- Block 1: HTTP — redirect all plain traffic to HTTPS ----
server {
    listen 80;
    server_name <API_DOMAIN>;

    # Allow ACME HTTP-01 challenges (Let's Encrypt / cert renewal automation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Block 2: HTTPS — terminate TLS, proxy to FastAPI ----
server {
    listen 443 ssl;
    http2 on;
    server_name <API_DOMAIN>;

    # TLS certificate (Cloudflare Origin cert or Let's Encrypt)
    ssl_certificate     /etc/nginx/certs/<API_DOMAIN>.pem;
    ssl_certificate_key /etc/nginx/certs/<API_DOMAIN>.key;

    # Modern TLS: TLS 1.2 minimum; TLS 1.3 preferred
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Session resumption
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (reduces client handshake latency)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # Diffie-Hellman params (generate once: openssl dhparam -out /etc/nginx/certs/dhparam.pem 2048)
    # ssl_dhparam /etc/nginx/certs/dhparam.pem;

    server_tokens off;

    # Upload limit: 5 images × 5 MB + multipart overhead
    client_max_body_size 30m;

    # Slow-loris mitigation
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Gzip for API JSON responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP (report-only until validated in production)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # HSTS — ramp the max-age gradually after TLS is confirmed stable
    # Start: add_header Strict-Transport-Security "max-age=300" always;
    # Final: add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    # add_header Strict-Transport-Security "max-age=300" always;

    # Deny hidden files (.git, .env, dotfiles)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check passthrough (deploy/monitoring probes)
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Reverse proxy all API traffic to FastAPI
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # API-only host: no SPA to serve
    location / {
        return 404;
    }
}
