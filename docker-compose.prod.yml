services:
  postgres:
    image: postgres:17-alpine
    container_name: infyexchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infy_strong_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-infyexchange}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infy} -d ${POSTGRES_DB:-infyexchange}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do NOT publish port 5432 to public internet in production

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infyexchange-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-infy}:${POSTGRES_PASSWORD:-infy_strong_password_change_me}@postgres:5432/${POSTGRES_DB:-infyexchange}
      SECRET_KEY: ${SECRET_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-gmail.com}
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 25
      DB_POOL_RECYCLE: 1800
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: infyexchange-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
