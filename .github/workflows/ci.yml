name: CI

# Runs the same gates used locally: frontend build + dependency audit,
# backend tests + static analysis + dependency vulnerability audit.
on:
  push:
    branches: [main, ship, deploy/neon-cloudrun-cloudflare-pages]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  backend:
    name: Backend (tests + bandit + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # Fresh build tooling and CA bundle (addresses the Oct-2026 pip/certifi
      # trust-store advisory) before anything is resolved or installed.
      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip setuptools wheel certifi
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Static security analysis (bandit)
        run: python -m bandit -r app -q
      # Gate on known vulnerabilities in the production dependency set.
      - name: Dependency vulnerability audit (pip-audit)
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan all Git history for secrets
        run: ./gitleaks git --log-opts="--all" --redact --exit-code 1 .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: /language:${{ matrix.language }}

  configuration-scan:
    name: Configuration and workflow scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 0.76.2
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate local Compose configuration
        working-directory: backend
        run: docker compose config -q
      - name: Build Cloud Run container
        run: docker build --tag infyexchange-api:ci backend

  deploy-cloud-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy/neon-cloudrun-cloudflare-pages'
    needs: [frontend, backend, deployment-config, secret-scan, codeql, configuration-scan]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cloud-run-deploy.yml

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy/neon-cloudrun-cloudflare-pages'
    needs: deploy-cloud-run
    permissions:
      contents: read
    uses: ./.github/workflows/pages-deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
