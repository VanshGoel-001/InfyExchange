name: Deploy Cloud Run

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cloud-run-neon-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: neon-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Validate deployment settings
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          for variable in GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE \
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT \
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT ARTIFACT_REGISTRY_REPOSITORY CORS_ORIGINS; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required GitHub repository variable: $variable" >&2
              exit 1
            fi
          done
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Configure Artifact Registry authentication
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build, attest, and push container
        id: image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/infyexchange-api:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --tag "$image_tag" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            backend
          digest="$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "BuildKit did not return a valid image digest." >&2
            exit 1
          fi
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/infyexchange-api@${digest}" >> "$GITHUB_OUTPUT"
      - name: Pull exact image digest for scanning
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker pull "$IMAGE"
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 0.76.2
          scan-type: image
          image-ref: ${{ steps.image.outputs.image }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
          vuln-type: os,library
      - name: Retain SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infyexchange-api-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 0.76.2
          scan-type: image
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
      - name: Deploy scanned image by digest
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT" \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --max 3 \
            --concurrency 40 \
            --set-env-vars "ENVIRONMENT=production,CORS_ORIGINS=$CORS_ORIGINS,HSTS_ENABLED=true,DB_POOL_SIZE=3,DB_MAX_OVERFLOW=2" \
            --set-secrets "DATABASE_URL=NEON_DATABASE_URL:latest,DATABASE_URL_UNPOOLED=NEON_DATABASE_URL_UNPOOLED:latest,SECRET_KEY=SECRET_KEY:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest"
      - name: Check deployed API health
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          service_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          curl --fail --retry 5 --retry-delay 5 "$service_url/health"