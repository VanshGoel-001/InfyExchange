# Rate-limit zones must live in the http context (this file is included inside http{})
# Modest edge limits: they complement the application-level limiters in the backend
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    server_name _;

    # Never advertise the nginx version
    server_tokens off;

    # Client upload limit matching backend max payload (5 images * 5MB + multipart overhead)
    client_max_body_size 30m;

    # Bound slow-loris style resource occupation (TH-18)
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Gzip compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP starts in report-only mode so violations are visible in browser devtools
    # without breaking the SPA. Flip to the enforcing "Content-Security-Policy"
    # header after verifying all assets load (see docs/security/SECURITY_RUNBOOK.md).
    # If the frontend is hosted on Cloudflare Pages and calls this API cross-origin,
    # add the API origin to connect-src before enforcing.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # HSTS: uncomment ONLY after HTTPS is confirmed for the API host (Cloudflare
    # proxy mode + working certificate) and no HTTP-only subdomain must be reached:
    # add_header Strict-Transport-Security "max-age=300" always;
    # Ramp: 300 -> 86400 (1 day) -> 604800 (1 week) -> 15552000 (180 days).

    # Static Frontend SPA
    root /usr/share/nginx/html;
    index index.html;

    # Allow ACME (certificate) challenges before the dotfile block below
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Deny access to hidden files (.git, .env, dotfiles)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Reverse proxy API requests to FastAPI
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propagate the edge request ID so backend logs correlate with nginx logs
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # SPA routing fallback (fixes deep links like /listings/5 or /profile)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
